<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏥 Idle Hospital Empire</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { width: 100%; height: 100%; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0a0d14; overflow: hidden; }
        body { display: flex; }

        #gameArea { flex: 1; display: flex; flex-direction: column; background: linear-gradient(135deg, #0a0d14 0%, #1a1f2e 100%); }

        #topBar {
            background: linear-gradient(90deg, rgba(0, 212, 255, 0.1) 0%, rgba(0, 100, 150, 0.1) 100%);
            color: #eaeaea;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #00d4ff;
            font-size: 14px;
            flex-wrap: wrap;
            gap: 20px;
            backdrop-filter: blur(5px);
        }

        .stat-row { display: flex; gap: 30px; align-items: center; flex-wrap: wrap; }
        .stat { display: flex; gap: 8px; align-items: center; font-weight: bold; }
        .stat-icon { font-size: 20px; }
        .stat-value { color: #00d4ff; font-size: 16px; font-weight: bold; }

        #canvasContainer { flex: 1; position: relative; overflow: hidden; }
        #canvas { width: 100%; height: 100%; display: block; background: linear-gradient(180deg, #0a0d14 0%, #0f1219 100%); cursor: pointer; }

        .panel {
            position: absolute;
            background: rgba(10, 13, 20, 0.95);
            border: 2px solid #00d4ff;
            border-radius: 12px;
            padding: 20px;
            color: #eaeaea;
            font-size: 12px;
            backdrop-filter: blur(20px);
            box-shadow: 0 8px 32px rgba(0, 212, 255, 0.2), inset 0 0 20px rgba(0, 212, 255, 0.05);
            max-height: 70vh;
            overflow-y: auto;
        }

        .panel-title {
            color: #00d4ff;
            font-weight: bold;
            margin-bottom: 16px;
            font-size: 16px;
            border-bottom: 2px solid #00d4ff;
            padding-bottom: 8px;
        }

        .stat-line {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid rgba(0, 212, 255, 0.1);
        }

        .stat-line:last-child { border: none; }
        .stat-label { color: #90b0d4; }
        .stat-val { color: #00ffff; font-weight: bold; }

        .btn {
            background: linear-gradient(90deg, #00d4ff 0%, #0099cc 100%);
            border: none;
            color: #000;
            padding: 12px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 10px;
            margin-right: 8px;
            font-size: 11px;
            transition: all 0.3s;
            width: 100%;
        }

        .btn:hover:not(:disabled) {
            background: linear-gradient(90deg, #00ffff 0%, #00ccff 100%);
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(0, 212, 255, 0.6);
        }

        .btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .btn-secondary {
            background: rgba(0, 212, 255, 0.15);
            border: 2px solid #00d4ff;
            color: #00d4ff;
        }

        .btn-secondary:hover:not(:disabled) {
            background: rgba(0, 212, 255, 0.25);
        }

        #statsPanel { top: 20px; left: 20px; width: 280px; }
        #roomPanel { top: 50%; left: 50%; transform: translate(-50%, -50%); width: 420px; display: none; z-index: 1000; }
        #receptionPanel { top: 50%; left: 50%; transform: translate(-50%, -50%); width: 420px; display: none; z-index: 1000; }

        .close-btn {
            position: absolute;
            top: 12px;
            right: 12px;
            background: rgba(233, 69, 96, 0.8);
            border: none;
            color: #fff;
            width: 36px;
            height: 36px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 20px;
            transition: all 0.2s;
        }

        .close-btn:hover { background: rgba(233, 69, 96, 1); }

        ::-webkit-scrollbar { width: 10px; }
        ::-webkit-scrollbar-track { background: rgba(0, 212, 255, 0.05); }
        ::-webkit-scrollbar-thumb { background: #00d4ff; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #00ffff; }

        .staff-row {
            background: rgba(0, 212, 255, 0.08);
            border-left: 3px solid #00d4ff;
            padding: 10px;
            margin: 8px 0;
            border-radius: 4px;
        }

        @keyframes popupFloat {
            0% { transform: translate(-50%, 0); opacity: 1; }
            100% { transform: translate(-50%, -60px); opacity: 0; }
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }

        .popup-text {
            position: fixed;
            font-weight: bold;
            pointer-events: none;
            animation: popupFloat 2s ease-out forwards;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.8);
            font-size: 18px;
        }

        .pulse { animation: pulse 0.5s ease-out; }
    </style>
</head>
<body>
    <div id="gameArea">
        <div id="topBar">
            <div class="stat-row">
                <div class="stat">
                    <span class="stat-icon">💰</span>
                    <span>$<span class="stat-value" id="moneyVal">5,100</span></span>
                </div>
                <div class="stat">
                    <span class="stat-icon">⚡</span>
                    <span id="mpsDisplay">+$10/s</span>
                </div>
                <div class="stat">
                    <span class="stat-icon">⭐</span>
                    <span>Rep: <span class="stat-value" id="repVal">0</span></span>
                </div>
                <div class="stat">
                    <span class="stat-icon">👥</span>
                    <span>Patients: <span class="stat-value" id="patientsVal">0</span></span>
                </div>
                <div class="stat">
                    <span class="stat-icon">👨‍⚕️</span>
                    <span>Staff: <span class="stat-value" id="staffVal">0</span></span>
                </div>
            </div>
            <div class="stat">
                <span class="stat-icon">🏥</span>
                <span style="font-weight: bold;">Community Clinic</span>
            </div>
        </div>

        <div id="canvasContainer">
            <canvas id="canvas"></canvas>
        </div>
    </div>

    <div class="panel" id="statsPanel">
        <div class="panel-title">📊 Hospital Status</div>
        <div class="stat-line">
            <span class="stat-label">Active Rooms:</span>
            <span class="stat-val" id="activeRooms">1</span>
        </div>
        <div class="stat-line">
            <span class="stat-label">Total Staff:</span>
            <span class="stat-val" id="totalStaffCount">0</span>
        </div>
        <div class="stat-line">
            <span class="stat-label">Income/Hour:</span>
            <span class="stat-val">$<span id="incomeHour">0</span></span>
        </div>
        <div class="stat-line">
            <span class="stat-label">Patients Waiting:</span>
            <span class="stat-val" id="waitingCount">0</span>
        </div>
        <div class="stat-line">
            <span class="stat-label">Patients Treated:</span>
            <span class="stat-val" id="treatedCount">0</span>
        </div>
    </div>

    <div class="panel" id="roomPanel">
        <button class="close-btn" onclick="closeRoom()">×</button>
        <div class="panel-title" id="roomTitle">Reception</div>
        <div id="roomContent"></div>
    </div>

    <div class="panel" id="receptionPanel">
        <button class="close-btn" onclick="closeReception()">×</button>
        <div class="panel-title">👨‍💼 Recruitment Center</div>
        <div id="receptionContent"></div>
    </div>

    <script>
        const ROOM_SIZE = 140;
        const ROOM_HEIGHT = 100;

        const game = {
            money: 5100,
            reputation: 0,
            prestige: 0,
            mps: 10,
            patientsServed: 0,
            patientQueue: [],
            staffList: [],
            floatingTexts: [],
            time: 0,
            nextPatientId: 0,
            nextStaffId: 0,

            rooms: [
                { id: 0, name: 'Reception', icon: '🪑', color: '#4CAF50', owned: 1, level: 1, x: 0, y: 0, production: 0, staff: [] },
                { id: 1, name: 'Examination', icon: '🔬', color: '#2196F3', owned: 0, level: 1, x: 1, y: 0, production: 50, staff: [] },
                { id: 2, name: 'Surgery', icon: '⚕️', color: '#FF6B6B', owned: 0, level: 1, x: 2, y: 0, production: 150, staff: [] },
                { id: 3, name: 'ICU', icon: '🏨', color: '#FF9800', owned: 0, level: 1, x: 0, y: 1, production: 200, staff: [] },
                { id: 4, name: 'Pharmacy', icon: '💉', color: '#9C27B0', owned: 0, level: 1, x: 1, y: 1, production: 75, staff: [] },
                { id: 5, name: 'Lab', icon: '🧪', color: '#00BCD4', owned: 0, level: 1, x: 2, y: 1, production: 100, staff: [] },
            ],

            staff: { intern: 0, resident: 0, attending: 0, specialist: 0 },
            staffCosts: { intern: 1000, resident: 3500, attending: 12000, specialist: 40000 },
            staffNames: { intern: 'Intern', resident: 'Resident', attending: 'Attending', specialist: 'Specialist' },
            staffColors: { intern: '#90caf9', resident: '#81c784', attending: '#ffb74d', specialist: '#f06292' },
            staffEfficiency: { intern: 1, resident: 2.5, attending: 6, specialist: 12 },

            addFloatingText(x, y, text, color) {
                this.floatingTexts.push({ x, y, text, color, time: 0, duration: 2 });
            },

            update(dt) {
                this.time += dt;

                // Update floating texts
                for (let i = this.floatingTexts.length - 1; i >= 0; i--) {
                    this.floatingTexts[i].time += dt;
                    if (this.floatingTexts[i].time > this.floatingTexts[i].duration) {
                        this.floatingTexts.splice(i, 1);
                    }
                }

                // Patient arrival
                const maxPatients = Math.floor(20 + this.getTotalStaff() * 2);
                if (this.patientQueue.length < maxPatients && Math.random() < 0.4 * dt) {
                    const colors = ['#FF6B9D', '#C44569', '#FFA07A', '#87CEEB', '#98D8C8'];
                    this.patientQueue.push({
                        id: this.nextPatientId++,
                        color: colors[Math.floor(Math.random() * colors.length)],
                        state: 'waiting',
                        timeInState: 0,
                        x: 180 + Math.random() * 40,
                        y: 120 + Math.random() * 40,
                        targetX: 0,
                        targetY: 0,
                    });
                }

                // Update patients
                for (let i = this.patientQueue.length - 1; i >= 0; i--) {
                    const p = this.patientQueue[i];
                    p.timeInState += dt;

                    if (p.state === 'waiting') {
                        // Smooth movement in queue
                        const targetIdx = i % 6;
                        p.targetX = 200 + (targetIdx % 3) * 25;
                        p.targetY = 130 + Math.floor(targetIdx / 3) * 25;
                        p.x += (p.targetX - p.x) * 0.05;
                        p.y += (p.targetY - p.y) * 0.05;

                        if (p.timeInState > 2 + Math.random()) {
                            p.state = 'treating';
                            p.timeInState = 0;
                        }
                    } else if (p.state === 'treating') {
                        // Move to treatment room
                        const room = this.rooms[1 + Math.floor(Math.random() * 2)];
                        if (room.owned > 0) {
                            p.targetX = room.x * ROOM_SIZE + 70 + Math.sin(this.time + i) * 20;
                            p.targetY = room.y * ROOM_HEIGHT + 50 + Math.cos(this.time + i) * 20;
                            p.x += (p.targetX - p.x) * 0.08;
                            p.y += (p.targetY - p.y) * 0.08;

                            if (p.timeInState > 3 + Math.random() * 2) {
                                const reward = 40 + Math.random() * 80;
                                this.money += reward;
                                this.reputation += 1 + Math.random();
                                this.patientsServed += 1;
                                this.addFloatingText(p.x, p.y, `+$${Math.floor(reward)}`, '#81c784');
                                this.patientQueue.splice(i, 1);
                            }
                        } else {
                            this.patientQueue.splice(i, 1);
                        }
                    }
                }

                // Spawn staff characters
                let staffNeeded = this.getTotalStaff();
                while (this.staffList.length < staffNeeded) {
                    this.staffList.push({
                        id: this.nextStaffId++,
                        tier: this.getStaffTierForIndex(this.staffList.length),
                        x: Math.random() * 300 + 100,
                        y: Math.random() * 200 + 50,
                        targetRoom: null,
                        moveTimer: 0,
                    });
                }

                // Remove extra staff
                while (this.staffList.length > staffNeeded) {
                    this.staffList.pop();
                }

                // Staff movement
                this.staffList.forEach((staff, idx) => {
                    staff.moveTimer -= dt;

                    if (staff.moveTimer <= 0) {
                        staff.targetRoom = this.rooms[Math.floor(Math.random() * this.rooms.length)];
                        staff.moveTimer = 3 + Math.random() * 3;
                    }

                    if (staff.targetRoom && staff.targetRoom.owned > 0) {
                        const targetX = staff.targetRoom.x * ROOM_SIZE + 70;
                        const targetY = staff.targetRoom.y * ROOM_HEIGHT + 50;
                        const dx = targetX - staff.x;
                        const dy = targetY - staff.y;
                        const dist = Math.sqrt(dx * dx + dy * dy);

                        if (dist > 3) {
                            staff.x += (dx / (dist + 0.1)) * 50 * dt;
                            staff.y += (dy / (dist + 0.1)) * 50 * dt;
                        }
                    }
                });

                // Calculate MPS
                this.mps = 5;
                Object.entries(this.staff).forEach(([tier, count]) => {
                    this.mps += count * this.staffEfficiency[tier] * 2;
                });
                this.mps += Math.min(this.patientQueue.length, 5) * 3;

                this.money += this.mps * dt;
            },

            getStaffTierForIndex(index) {
                let current = 0;
                for (const tier of ['intern', 'resident', 'attending', 'specialist']) {
                    if (index < current + this.staff[tier]) return tier;
                    current += this.staff[tier];
                }
                return 'intern';
            },

            buyRoom(id) {
                const cost = Math.floor(500 * Math.pow(1.5, this.rooms[id].owned));
                if (this.money >= cost) {
                    this.money -= cost;
                    this.rooms[id].owned += 1;
                    this.addFloatingText(this.rooms[id].x * ROOM_SIZE + 70, this.rooms[id].y * ROOM_HEIGHT + 50, '🏗️ +Room', '#00d4ff');
                    return true;
                }
                return false;
            },

            upgradeRoom(id) {
                const cost = Math.floor(1000 * Math.pow(1.4, this.rooms[id].level - 1));
                if (this.money >= cost) {
                    this.money -= cost;
                    this.rooms[id].level += 1;
                    this.addFloatingText(this.rooms[id].x * ROOM_SIZE + 70, this.rooms[id].y * ROOM_HEIGHT + 50, '⬆️ +Level', '#ffb74d');
                    return true;
                }
                return false;
            },

            hireStaff(tier) {
                if (this.money >= this.staffCosts[tier]) {
                    this.money -= this.staffCosts[tier];
                    this.staff[tier] += 1;
                    this.addFloatingText(250, 150, `✓ Hired ${this.staffNames[tier]}`, this.staffColors[tier]);
                    return true;
                }
                return false;
            },

            getTotalStaff() {
                return Object.values(this.staff).reduce((a, b) => a + b, 0);
            },

            format(n) {
                if (n >= 1e9) return (n / 1e9).toFixed(1) + 'B';
                if (n >= 1e6) return (n / 1e6).toFixed(1) + 'M';
                if (n >= 1e3) return (n / 1e3).toFixed(1) + 'K';
                return Math.floor(n).toString();
            }
        };

        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = canvas.offsetWidth;
            canvas.height = canvas.offsetHeight;
        }

        function drawIsometricRoom(room) {
            const baseX = room.x * ROOM_SIZE - room.y * ROOM_SIZE / 2 + 500;
            const baseY = room.y * ROOM_HEIGHT / 2 + 150;

            // Shadow
            ctx.fillStyle = 'rgba(0, 0, 0, 0.25)';
            ctx.beginPath();
            ctx.ellipse(baseX + ROOM_SIZE / 2, baseY + ROOM_HEIGHT + 8, ROOM_SIZE / 2 + 5, 10, 0, 0, Math.PI * 2);
            ctx.fill();

            // Gradient fill
            const grad = ctx.createLinearGradient(baseX, baseY, baseX + ROOM_SIZE, baseY + ROOM_HEIGHT);
            grad.addColorStop(0, room.color + '60');
            grad.addColorStop(0.5, room.color + '40');
            grad.addColorStop(1, room.color + '20');

            ctx.fillStyle = grad;
            ctx.strokeStyle = room.color;
            ctx.lineWidth = 2.5;

            // Isometric box
            ctx.beginPath();
            ctx.moveTo(baseX, baseY + 35);
            ctx.lineTo(baseX + ROOM_SIZE / 2, baseY - 25);
            ctx.lineTo(baseX + ROOM_SIZE, baseY + 35);
            ctx.lineTo(baseX + ROOM_SIZE / 2, baseY + 85);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            // Highlight edge
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.25)';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.moveTo(baseX, baseY + 35);
            ctx.lineTo(baseX + ROOM_SIZE / 2, baseY - 25);
            ctx.stroke();

            // Icon
            ctx.font = 'bold 50px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillStyle = '#fff';
            ctx.shadowColor = 'rgba(0,0,0,0.8)';
            ctx.shadowBlur = 10;
            ctx.shadowOffsetX = 2;
            ctx.shadowOffsetY = 2;
            ctx.fillText(room.icon, baseX + ROOM_SIZE / 2, baseY + 25);
            ctx.shadowBlur = 0;

            // Room name
            ctx.font = 'bold 12px Arial';
            ctx.fillStyle = room.color;
            ctx.fillText(room.name, baseX + ROOM_SIZE / 2, baseY + 63);

            // Owned indicator
            ctx.font = '10px Arial';
            ctx.fillStyle = room.owned > 0 ? '#aaa' : '#666';
            ctx.fillText(room.owned > 0 ? `×${room.owned} | Lvl${room.level}` : 'Click to buy', baseX + ROOM_SIZE / 2, baseY + 76);

            room.clickArea = { x: baseX - 10, y: baseY - 55, w: ROOM_SIZE + 20, h: 160 };
        }

        function drawCharacter(x, y, color, size = 1, label = '') {
            // Head
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.arc(x, y - 10 * size, 6 * size, 0, Math.PI * 2);
            ctx.fill();

            // Body
            ctx.fillRect(x - 3 * size, y - 2 * size, 6 * size, 10 * size);

            // Outline
            ctx.strokeStyle = 'rgba(0, 0, 0, 0.4)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.arc(x, y - 10 * size, 6 * size, 0, Math.PI * 2);
            ctx.stroke();

            // Label
            if (label) {
                ctx.fillStyle = '#fff';
                ctx.font = 'bold 8px Arial';
                ctx.textAlign = 'center';
                ctx.fillText(label, x, y - 18 * size);
            }
        }

        function drawGame() {
            // Background gradient
            const bgGrad = ctx.createLinearGradient(0, 0, 0, canvas.height);
            bgGrad.addColorStop(0, '#0a0d14');
            bgGrad.addColorStop(1, '#0f1219');
            ctx.fillStyle = bgGrad;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Grid
            ctx.strokeStyle = 'rgba(0, 212, 255, 0.03)';
            ctx.lineWidth = 0.5;
            for (let i = 0; i < canvas.width; i += 50) {
                ctx.beginPath();
                ctx.moveTo(i, 0);
                ctx.lineTo(i, canvas.height);
                ctx.stroke();
            }
            for (let i = 0; i < canvas.height; i += 50) {
                ctx.beginPath();
                ctx.moveTo(0, i);
                ctx.lineTo(canvas.width, i);
                ctx.stroke();
            }

            // Draw rooms
            game.rooms.forEach(room => drawIsometricRoom(room));

            // Draw staff
            game.staffList.forEach((staff, idx) => {
                drawCharacter(staff.x, staff.y, game.staffColors[staff.tier], 1, staff.tier[0].toUpperCase());
            });

            // Draw patients
            game.patientQueue.forEach((patient, idx) => {
                drawCharacter(patient.x, patient.y, patient.color, 0.85);

                // Status dot
                ctx.fillStyle = patient.state === 'treating' ? '#ffb74d' : '#00d4ff';
                ctx.beginPath();
                ctx.arc(patient.x + 12, patient.y - 16, 3, 0, Math.PI * 2);
                ctx.fill();
            });

            // Draw floating texts
            game.floatingTexts.forEach(ft => {
                const progress = ft.time / ft.duration;
                ctx.globalAlpha = 1 - progress;
                ctx.fillStyle = ft.color;
                ctx.font = 'bold 14px Arial';
                ctx.textAlign = 'center';
                ctx.shadowColor = 'rgba(0,0,0,0.8)';
                ctx.shadowBlur = 6;
                ctx.fillText(ft.text, ft.x, ft.y - progress * 50);
                ctx.shadowBlur = 0;
                ctx.globalAlpha = 1;
            });

            // Info overlay
            ctx.font = 'bold 14px Arial';
            ctx.fillStyle = '#00d4ff';
            ctx.textAlign = 'left';
            ctx.fillText(`👥 Patients Waiting: ${game.patientQueue.length}`, 20, 30);

            ctx.font = '12px Arial';
            ctx.fillStyle = '#90b0d4';
            ctx.fillText(`👨‍⚕️ Staff: ${game.getTotalStaff()} | 💰 +$${game.format(game.mps)}/s`, 20, 48);
        }

        function updateUI() {
            document.getElementById('moneyVal').textContent = game.format(game.money);
            document.getElementById('mpsDisplay').textContent = `+$${game.format(game.mps)}/s`;
            document.getElementById('repVal').textContent = Math.floor(game.reputation);
            document.getElementById('patientsVal').textContent = Math.floor(game.patientsServed);
            document.getElementById('staffVal').textContent = game.getTotalStaff();

            const activeRooms = game.rooms.filter(r => r.owned > 0).length;
            document.getElementById('activeRooms').textContent = activeRooms;
            document.getElementById('totalStaffCount').textContent = game.getTotalStaff();
            document.getElementById('incomeHour').textContent = game.format(game.mps * 3600);
            document.getElementById('waitingCount').textContent = game.patientQueue.length;
            document.getElementById('treatedCount').textContent = game.patientsServed;
        }

        function showRoom(id) {
            const room = game.rooms[id];
            const panel = document.getElementById('roomPanel');
            document.getElementById('roomTitle').textContent = `${room.icon} ${room.name}`;

            const buyCost = Math.floor(500 * Math.pow(1.5, room.owned));
            const upgradeCost = Math.floor(1000 * Math.pow(1.4, room.level - 1));

            let html = `
                <div class="stat-line"><span class="stat-label">Owned:</span><span class="stat-val">${room.owned}</span></div>
                <div class="stat-line"><span class="stat-label">Level:</span><span class="stat-val">${room.level}</span></div>
                <div class="stat-line"><span class="stat-label">Value:</span><span class="stat-val">$${game.format(room.production * room.level)}/patient</span></div>

                <button class="btn" onclick="game.buyRoom(${id}); updateUI(); showRoom(${id});" ${game.money < buyCost ? 'disabled' : ''}>
                    BUY ANOTHER - $${game.format(buyCost)}
                </button>
                <button class="btn" onclick="game.upgradeRoom(${id}); updateUI(); showRoom(${id});" ${game.money < upgradeCost ? 'disabled' : ''}>
                    UPGRADE LEVEL - $${game.format(upgradeCost)}
                </button>
            `;

            document.getElementById('roomContent').innerHTML = html;
            panel.style.display = 'block';
        }

        function closeRoom() {
            document.getElementById('roomPanel').style.display = 'none';
        }

        function showReception() {
            const panel = document.getElementById('receptionPanel');
            const content = document.getElementById('receptionContent');

            let html = '<div style="margin-bottom: 12px; font-size: 11px; color: #90b0d4;">Hire staff to increase hospital efficiency and patient throughput.</div>';
            ['intern', 'resident', 'attending', 'specialist'].forEach(tier => {
                const cost = game.staffCosts[tier];
                const name = game.staffNames[tier];
                const count = game.staff[tier];
                const color = game.staffColors[tier];
                const efficiency = game.staffEfficiency[tier];

                html += `
                    <div class="staff-row">
                        <div class="stat-line">
                            <span class="stat-label" style="color: ${color};">● ${name}</span>
                            <span class="stat-val">×${count}</span>
                        </div>
                        <div class="stat-line">
                            <span class="stat-label">Income Boost:</span>
                            <span class="stat-val">+${game.format(efficiency * 2)}/s</span>
                        </div>
                        <button class="btn btn-secondary" onclick="game.hireStaff('${tier}'); updateUI(); showReception();" ${game.money < cost ? 'disabled' : ''}>
                            HIRE - $${game.format(cost)}
                        </button>
                    </div>
                `;
            });

            content.innerHTML = html;
            panel.style.display = 'block';
        }

        function closeReception() {
            document.getElementById('receptionPanel').style.display = 'none';
        }

        canvas.addEventListener('click', (e) => {
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            game.rooms.forEach((room, i) => {
                if (room.clickArea) {
                    const area = room.clickArea;
                    if (x > area.x && x < area.x + area.w && y > area.y && y < area.y + area.h) {
                        if (i === 0) showReception();
                        else showRoom(i);
                    }
                }
            });
        });

        let lastTime = Date.now();
        function gameLoop() {
            const now = Date.now();
            const dt = Math.min((now - lastTime) / 1000, 0.1);
            lastTime = now;

            game.update(dt);
            updateUI();
            drawGame();

            requestAnimationFrame(gameLoop);
        }

        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);
        gameLoop();
    </script>
</body>
</html>
