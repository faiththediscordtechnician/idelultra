<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏥 Idle Hospital Empire</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { width: 100%; height: 100%; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0a0d14; overflow: hidden; }
        body { display: flex; }

        #gameArea { flex: 1; display: flex; flex-direction: column; background: linear-gradient(135deg, #0a0d14 0%, #1a1f2e 100%); }

        #topBar {
            background: linear-gradient(90deg, rgba(0, 212, 255, 0.1) 0%, rgba(0, 100, 150, 0.1) 100%);
            color: #eaeaea;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #00d4ff;
            font-size: 14px;
            flex-wrap: wrap;
            gap: 20px;
            backdrop-filter: blur(5px);
        }

        .stat-row { display: flex; gap: 30px; align-items: center; flex-wrap: wrap; }
        .stat { display: flex; gap: 8px; align-items: center; font-weight: bold; }
        .stat-icon { font-size: 20px; }
        .stat-value { color: #00d4ff; font-size: 16px; font-weight: bold; }

        #canvasContainer { flex: 1; position: relative; overflow: hidden; }
        #canvas { width: 100%; height: 100%; display: block; background: linear-gradient(180deg, #0a0d14 0%, #0f1219 100%); cursor: pointer; }

        .panel {
            position: absolute;
            background: rgba(10, 13, 20, 0.95);
            border: 2px solid #00d4ff;
            border-radius: 12px;
            padding: 20px;
            color: #eaeaea;
            font-size: 12px;
            backdrop-filter: blur(20px);
            box-shadow: 0 8px 32px rgba(0, 212, 255, 0.2), inset 0 0 20px rgba(0, 212, 255, 0.05);
            max-height: 70vh;
            overflow-y: auto;
        }

        .panel-title {
            color: #00d4ff;
            font-weight: bold;
            margin-bottom: 16px;
            font-size: 16px;
            border-bottom: 2px solid #00d4ff;
            padding-bottom: 8px;
        }

        .stat-line {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid rgba(0, 212, 255, 0.1);
        }

        .stat-line:last-child { border: none; }
        .stat-label { color: #90b0d4; }
        .stat-val { color: #00ffff; font-weight: bold; }

        .btn {
            background: linear-gradient(90deg, #00d4ff 0%, #0099cc 100%);
            border: none;
            color: #000;
            padding: 12px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 10px;
            margin-right: 8px;
            font-size: 11px;
            transition: all 0.3s;
            width: 100%;
        }

        .btn:hover:not(:disabled) {
            background: linear-gradient(90deg, #00ffff 0%, #00ccff 100%);
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(0, 212, 255, 0.6);
        }

        .btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .btn-secondary {
            background: rgba(0, 212, 255, 0.15);
            border: 2px solid #00d4ff;
            color: #00d4ff;
        }

        #statsPanel { top: 20px; left: 20px; width: 280px; }
        #roomPanel { top: 50%; left: 50%; transform: translate(-50%, -50%); width: 420px; display: none; z-index: 1000; }
        #receptionPanel { top: 50%; left: 50%; transform: translate(-50%, -50%); width: 420px; display: none; z-index: 1000; }

        .close-btn {
            position: absolute;
            top: 12px;
            right: 12px;
            background: rgba(233, 69, 96, 0.8);
            border: none;
            color: #fff;
            width: 36px;
            height: 36px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 20px;
            transition: all 0.2s;
        }

        .close-btn:hover { background: rgba(233, 69, 96, 1); }

        ::-webkit-scrollbar { width: 10px; }
        ::-webkit-scrollbar-track { background: rgba(0, 212, 255, 0.05); }
        ::-webkit-scrollbar-thumb { background: #00d4ff; border-radius: 4px; }

        .staff-row {
            background: rgba(0, 212, 255, 0.08);
            border-left: 3px solid #00d4ff;
            padding: 10px;
            margin: 8px 0;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div id="gameArea">
        <div id="topBar">
            <div class="stat-row">
                <div class="stat">
                    <span class="stat-icon">💰</span>
                    <span>$<span class="stat-value" id="moneyVal">5,100</span></span>
                </div>
                <div class="stat">
                    <span class="stat-icon">⚡</span>
                    <span id="mpsDisplay">+$10/s</span>
                </div>
                <div class="stat">
                    <span class="stat-icon">⭐</span>
                    <span>Rep: <span class="stat-value" id="repVal">0</span></span>
                </div>
                <div class="stat">
                    <span class="stat-icon">👥</span>
                    <span>Patients: <span class="stat-value" id="patientsVal">0</span></span>
                </div>
                <div class="stat">
                    <span class="stat-icon">👨‍⚕️</span>
                    <span>Staff: <span class="stat-value" id="staffVal">0</span></span>
                </div>
            </div>
            <div class="stat">
                <span class="stat-icon">🏥</span>
                <span style="font-weight: bold;">Community Clinic</span>
            </div>
        </div>

        <div id="canvasContainer">
            <canvas id="canvas"></canvas>
        </div>
    </div>

    <div class="panel" id="statsPanel">
        <div class="panel-title">📊 Hospital Status</div>
        <div class="stat-line">
            <span class="stat-label">Active Rooms:</span>
            <span class="stat-val" id="activeRooms">1</span>
        </div>
        <div class="stat-line">
            <span class="stat-label">Total Staff:</span>
            <span class="stat-val" id="totalStaffCount">0</span>
        </div>
        <div class="stat-line">
            <span class="stat-label">Income/Hour:</span>
            <span class="stat-val">$<span id="incomeHour">0</span></span>
        </div>
        <div class="stat-line">
            <span class="stat-label">Patients Waiting:</span>
            <span class="stat-val" id="waitingCount">0</span>
        </div>
        <div class="stat-line">
            <span class="stat-label">Patients Treated:</span>
            <span class="stat-val" id="treatedCount">0</span>
        </div>
    </div>

    <div class="panel" id="roomPanel">
        <button class="close-btn" onclick="closeRoom()">×</button>
        <div class="panel-title" id="roomTitle">Reception</div>
        <div id="roomContent"></div>
    </div>

    <div class="panel" id="receptionPanel">
        <button class="close-btn" onclick="closeReception()">×</button>
        <div class="panel-title">👨‍💼 Recruitment Center</div>
        <div id="receptionContent"></div>
    </div>

    <script>
        const ROOM_W = 160;
        const ROOM_H = 130;

        const game = {
            money: 5100,
            reputation: 0,
            mps: 10,
            patientsServed: 0,
            patientQueue: [],
            staffList: [],
            time: 0,
            nextPatientId: 0,
            nextStaffId: 0,

            rooms: [
                { id: 0, name: 'Reception', icon: '🪑', baseColor: '#4CAF50', rgb: [76, 175, 80], owned: 1, level: 1, x: 0, y: 0, production: 0 },
                { id: 1, name: 'Examination', icon: '🔬', baseColor: '#2196F3', rgb: [33, 150, 243], owned: 0, level: 1, x: 1, y: 0, production: 50 },
                { id: 2, name: 'Surgery', icon: '⚕️', baseColor: '#FF6B6B', rgb: [255, 107, 107], owned: 0, level: 1, x: 2, y: 0, production: 150 },
                { id: 3, name: 'ICU', icon: '🏨', baseColor: '#FF9800', rgb: [255, 152, 0], owned: 0, level: 1, x: 0, y: 1, production: 200 },
                { id: 4, name: 'Pharmacy', icon: '💉', baseColor: '#9C27B0', rgb: [156, 39, 176], owned: 0, level: 1, x: 1, y: 1, production: 75 },
                { id: 5, name: 'Lab', icon: '🧪', baseColor: '#00BCD4', rgb: [0, 188, 212], owned: 0, level: 1, x: 2, y: 1, production: 100 },
            ],

            staff: { intern: 0, resident: 0, attending: 0, specialist: 0 },
            staffCosts: { intern: 1000, resident: 3500, attending: 12000, specialist: 40000 },
            staffNames: { intern: 'Intern', resident: 'Resident', attending: 'Attending', specialist: 'Specialist' },
            staffColors: { intern: '#90caf9', resident: '#81c784', attending: '#ffb74d', specialist: '#f06292' },
            staffRGB: { intern: [144, 202, 249], resident: [129, 199, 132], attending: [255, 183, 77], specialist: [240, 98, 146] },

            update(dt) {
                this.time += dt;

                // Patient arrival
                const maxPatients = Math.floor(15 + this.getTotalStaff() * 2);
                if (this.patientQueue.length < maxPatients && Math.random() < 0.4 * dt) {
                    const colors = ['#FF6B9D', '#C44569', '#FFA07A', '#87CEEB'];
                    this.patientQueue.push({
                        id: this.nextPatientId++,
                        color: colors[Math.floor(Math.random() * colors.length)],
                        state: 'waiting',
                        timeInState: 0,
                    });
                }

                // Update patients
                for (let i = this.patientQueue.length - 1; i >= 0; i--) {
                    const p = this.patientQueue[i];
                    p.timeInState += dt;

                    if (p.state === 'waiting') {
                        const treatableRooms = this.rooms.filter(r => r.owned > 0 && r.id > 0);
                        if (treatableRooms.length > 0 && p.timeInState > 1 + Math.random()) {
                            p.state = 'treating';
                            p.roomId = treatableRooms[Math.floor(Math.random() * treatableRooms.length)].id;
                            p.timeInState = 0;
                        }
                    } else if (p.state === 'treating') {
                        if (p.timeInState > 3 + Math.random() * 2) {
                            const reward = 40 + Math.random() * 80;
                            this.money += reward;
                            this.reputation += 1;
                            this.patientsServed += 1;
                            this.patientQueue.splice(i, 1);
                        }
                    }
                }

                // Staff spawning
                let staffNeeded = this.getTotalStaff();
                while (this.staffList.length < staffNeeded) {
                    const tier = this.getStaffTierAt(this.staffList.length);
                    this.staffList.push({
                        id: this.nextStaffId++,
                        tier: tier,
                        assignedRoom: this.rooms[Math.floor(Math.random() * this.rooms.length)],
                    });
                }
                while (this.staffList.length > staffNeeded) {
                    this.staffList.pop();
                }

                // Calculate income
                this.mps = 5 + this.patientQueue.filter(p => p.state === 'waiting').length * 1;
                Object.entries(this.staff).forEach(([tier, count]) => {
                    const multipliers = { intern: 2, resident: 6, attending: 15, specialist: 40 };
                    this.mps += count * multipliers[tier];
                });
                this.money += this.mps * dt;
            },

            getStaffTierAt(index) {
                let total = 0;
                for (const tier of ['intern', 'resident', 'attending', 'specialist']) {
                    if (index < total + this.staff[tier]) return tier;
                    total += this.staff[tier];
                }
                return 'intern';
            },

            buyRoom(id) {
                const cost = Math.floor(500 * Math.pow(1.5, this.rooms[id].owned));
                if (this.money >= cost) {
                    this.money -= cost;
                    this.rooms[id].owned += 1;
                    return true;
                }
                return false;
            },

            upgradeRoom(id) {
                const cost = Math.floor(1000 * Math.pow(1.4, this.rooms[id].level - 1));
                if (this.money >= cost) {
                    this.money -= cost;
                    this.rooms[id].level += 1;
                    return true;
                }
                return false;
            },

            hireStaff(tier) {
                if (this.money >= this.staffCosts[tier]) {
                    this.money -= this.staffCosts[tier];
                    this.staff[tier] += 1;
                    return true;
                }
                return false;
            },

            getTotalStaff() {
                return Object.values(this.staff).reduce((a, b) => a + b, 0);
            },

            format(n) {
                if (n >= 1e9) return (n / 1e9).toFixed(1) + 'B';
                if (n >= 1e6) return (n / 1e6).toFixed(1) + 'M';
                if (n >= 1e3) return (n / 1e3).toFixed(1) + 'K';
                return Math.floor(n).toString();
            }
        };

        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = canvas.offsetWidth;
            canvas.height = canvas.offsetHeight;
        }

        function drawRoomInterior(room, x, y) {
            // Room background - light colored interior
            ctx.fillStyle = 'rgba(245, 245, 245, 0.95)';
            ctx.fillRect(x + 4, y + 4, ROOM_W - 8, ROOM_H - 8);

            // Room border
            ctx.strokeStyle = room.baseColor;
            ctx.lineWidth = 3;
            ctx.strokeRect(x + 4, y + 4, ROOM_W - 8, ROOM_H - 8);

            // Interior border detail
            ctx.strokeStyle = 'rgba(0, 0, 0, 0.1)';
            ctx.lineWidth = 1;
            ctx.strokeRect(x + 6, y + 6, ROOM_W - 12, ROOM_H - 12);

            if (room.owned === 0) {
                // Empty room
                ctx.fillStyle = 'rgba(150, 150, 150, 0.3)';
                ctx.font = 'bold 14px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('Click to Buy', x + ROOM_W / 2, y + ROOM_H / 2 - 10);
                ctx.font = '11px Arial';
                ctx.fillText(room.icon, x + ROOM_W / 2, y + ROOM_H / 2 + 15);
                return;
            }

            // Room icon/title
            ctx.fillStyle = room.baseColor;
            ctx.font = 'bold 24px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(room.icon, x + ROOM_W / 2, y + 15);

            // Room name
            ctx.fillStyle = room.baseColor;
            ctx.font = 'bold 10px Arial';
            ctx.fillText(room.name, x + ROOM_W / 2, y + 30);

            // Room details
            ctx.fillStyle = '#333';
            ctx.font = '8px Arial';
            ctx.fillText(`Lvl${room.level}×${room.owned}`, x + ROOM_W / 2, y + 42);

            // Draw people in room - varied positions
            const patientsInRoom = game.patientQueue.filter(p => p.roomId === room.id);
            const staffInRoom = game.staffList.filter(s => s.assignedRoom.id === room.id);

            // Patients
            patientsInRoom.slice(0, 3).forEach((p, idx) => {
                const px = x + 20 + idx * 35;
                const py = y + 65;
                drawPerson(px, py, p.color, 0.7);
            });

            // Staff
            staffInRoom.slice(0, 2).forEach((s, idx) => {
                const sx = x + 25 + idx * 45;
                const sy = y + 95;
                drawPerson(sx, sy, game.staffColors[s.tier], 0.75);
            });

            // Activity indicator
            if ((patientsInRoom.length > 0 || staffInRoom.length > 0) && Math.sin(game.time * 4) > 0.5) {
                ctx.fillStyle = room.baseColor + '66';
                ctx.beginPath();
                ctx.arc(x + ROOM_W - 12, y + 12, 4, 0, Math.PI * 2);
                ctx.fill();
            }

            room.clickArea = { x, y, w: ROOM_W, h: ROOM_H };
        }

        function drawPerson(x, y, color, scale = 1) {
            const headR = 3 * scale;
            const bodyW = 3 * scale;
            const bodyH = 6 * scale;
            const armW = 7 * scale;

            // Head
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.arc(x, y - bodyH / 2 - 2, headR, 0, Math.PI * 2);
            ctx.fill();

            // Body
            ctx.fillStyle = color;
            ctx.fillRect(x - bodyW / 2, y - bodyH / 2 + 1, bodyW, bodyH - 2);

            // Arms
            ctx.fillRect(x - armW / 2, y - bodyH / 4, armW, 1.5 * scale);

            // Legs
            ctx.fillRect(x - 1.5 * scale, y + bodyH / 2, 1.5 * scale, 3 * scale);
            ctx.fillRect(x, y + bodyH / 2, 1.5 * scale, 3 * scale);
        }

        function drawGame() {
            const bgGrad = ctx.createLinearGradient(0, 0, 0, canvas.height);
            bgGrad.addColorStop(0, '#0a0d14');
            bgGrad.addColorStop(1, '#0f1219');
            ctx.fillStyle = bgGrad;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Grid
            ctx.strokeStyle = 'rgba(0, 212, 255, 0.02)';
            ctx.lineWidth = 0.5;
            for (let i = 0; i < canvas.width; i += 50) {
                ctx.beginPath();
                ctx.moveTo(i, 0);
                ctx.lineTo(i, canvas.height);
                ctx.stroke();
            }

            // Draw rooms in grid
            const gridW = 3;
            const spacing = 20;
            game.rooms.forEach(room => {
                const gx = room.x;
                const gy = room.y;
                const px = gx * (ROOM_W + spacing) + 280;
                const py = gy * (ROOM_H + spacing) + 140;
                drawRoomInterior(room, px, py);
            });

            // Info
            ctx.font = 'bold 13px Arial';
            ctx.fillStyle = '#00d4ff';
            ctx.textAlign = 'left';
            ctx.fillText(`👥 Waiting: ${game.patientQueue.filter(p => p.state === 'waiting').length}`, 20, 30);

            ctx.font = '11px Arial';
            ctx.fillStyle = '#90b0d4';
            ctx.fillText(`👨‍⚕️ Staff: ${game.getTotalStaff()} • Income: +$${game.format(game.mps)}/s`, 20, 48);
        }

        function updateUI() {
            document.getElementById('moneyVal').textContent = game.format(game.money);
            document.getElementById('mpsDisplay').textContent = `+$${game.format(game.mps)}/s`;
            document.getElementById('repVal').textContent = Math.floor(game.reputation);
            document.getElementById('patientsVal').textContent = Math.floor(game.patientsServed);
            document.getElementById('staffVal').textContent = game.getTotalStaff();

            const activeRooms = game.rooms.filter(r => r.owned > 0).length;
            document.getElementById('activeRooms').textContent = activeRooms;
            document.getElementById('totalStaffCount').textContent = game.getTotalStaff();
            document.getElementById('incomeHour').textContent = game.format(game.mps * 3600);
            document.getElementById('waitingCount').textContent = game.patientQueue.filter(p => p.state === 'waiting').length;
            document.getElementById('treatedCount').textContent = game.patientsServed;
        }

        function showRoom(id) {
            const room = game.rooms[id];
            const panel = document.getElementById('roomPanel');
            document.getElementById('roomTitle').textContent = `${room.icon} ${room.name}`;

            const buyCost = Math.floor(500 * Math.pow(1.5, room.owned));
            const upgradeCost = Math.floor(1000 * Math.pow(1.4, room.level - 1));

            let html = `
                <div class="stat-line"><span class="stat-label">Owned:</span><span class="stat-val">${room.owned}</span></div>
                <div class="stat-line"><span class="stat-label">Level:</span><span class="stat-val">${room.level}</span></div>
                <div class="stat-line"><span class="stat-label">Revenue/Patient:</span><span class="stat-val">$${game.format(room.production * room.level)}</span></div>

                <button class="btn" onclick="game.buyRoom(${id}); updateUI(); showRoom(${id});" ${game.money < buyCost ? 'disabled' : ''}>
                    BUY ANOTHER - $${game.format(buyCost)}
                </button>
                <button class="btn" onclick="game.upgradeRoom(${id}); updateUI(); showRoom(${id});" ${game.money < upgradeCost ? 'disabled' : ''}>
                    UPGRADE LEVEL - $${game.format(upgradeCost)}
                </button>
            `;

            document.getElementById('roomContent').innerHTML = html;
            panel.style.display = 'block';
        }

        function closeRoom() {
            document.getElementById('roomPanel').style.display = 'none';
        }

        function showReception() {
            const panel = document.getElementById('receptionPanel');
            const content = document.getElementById('receptionContent');

            let html = '<div style="margin-bottom: 12px; font-size: 11px; color: #90b0d4;">Hire skilled medical staff to treat more patients faster.</div>';
            ['intern', 'resident', 'attending', 'specialist'].forEach(tier => {
                const cost = game.staffCosts[tier];
                const name = game.staffNames[tier];
                const count = game.staff[tier];
                const color = game.staffColors[tier];

                html += `
                    <div class="staff-row">
                        <div class="stat-line">
                            <span class="stat-label" style="color: ${color};">● ${name}</span>
                            <span class="stat-val">×${count}</span>
                        </div>
                        <button class="btn btn-secondary" onclick="game.hireStaff('${tier}'); updateUI(); showReception();" ${game.money < cost ? 'disabled' : ''}>
                            HIRE - $${game.format(cost)}
                        </button>
                    </div>
                `;
            });

            content.innerHTML = html;
            panel.style.display = 'block';
        }

        function closeReception() {
            document.getElementById('receptionPanel').style.display = 'none';
        }

        canvas.addEventListener('click', (e) => {
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            game.rooms.forEach((room, i) => {
                if (room.clickArea) {
                    const area = room.clickArea;
                    if (x > area.x && x < area.x + area.w && y > area.y && y < area.y + area.h) {
                        if (i === 0) showReception();
                        else showRoom(i);
                    }
                }
            });
        });

        let lastTime = Date.now();
        function gameLoop() {
            const now = Date.now();
            const dt = Math.min((now - lastTime) / 1000, 0.1);
            lastTime = now;

            game.update(dt);
            updateUI();
            drawGame();

            requestAnimationFrame(gameLoop);
        }

        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);
        gameLoop();
    </script>
</body>
</html>
