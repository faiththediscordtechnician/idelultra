<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏥 Idle Hospital Empire</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { width: 100%; height: 100%; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0a0d14; overflow: hidden; }
        body { display: flex; }

        #gameArea { flex: 1; display: flex; flex-direction: column; background: linear-gradient(135deg, #0a0d14 0%, #1a1f2e 100%); }

        #topBar {
            background: linear-gradient(90deg, rgba(0, 212, 255, 0.1) 0%, rgba(0, 100, 150, 0.1) 100%);
            color: #eaeaea;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #00d4ff;
            font-size: 14px;
            flex-wrap: wrap;
            gap: 20px;
            backdrop-filter: blur(5px);
        }

        .stat-row { display: flex; gap: 30px; align-items: center; flex-wrap: wrap; }
        .stat { display: flex; gap: 8px; align-items: center; font-weight: bold; }
        .stat-icon { font-size: 20px; }
        .stat-value { color: #00d4ff; font-size: 16px; font-weight: bold; }

        #canvasContainer { flex: 1; position: relative; overflow: hidden; }
        #canvas { width: 100%; height: 100%; display: block; background: linear-gradient(180deg, #0a0d14 0%, #0f1219 100%); cursor: pointer; }

        .panel {
            position: absolute;
            background: rgba(10, 13, 20, 0.95);
            border: 2px solid #00d4ff;
            border-radius: 12px;
            padding: 20px;
            color: #eaeaea;
            font-size: 12px;
            backdrop-filter: blur(20px);
            box-shadow: 0 8px 32px rgba(0, 212, 255, 0.2), inset 0 0 20px rgba(0, 212, 255, 0.05);
            max-height: 70vh;
            overflow-y: auto;
        }

        .panel-title {
            color: #00d4ff;
            font-weight: bold;
            margin-bottom: 16px;
            font-size: 16px;
            border-bottom: 2px solid #00d4ff;
            padding-bottom: 8px;
        }

        .stat-line {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid rgba(0, 212, 255, 0.1);
        }

        .stat-line:last-child { border: none; }
        .stat-label { color: #90b0d4; }
        .stat-val { color: #00ffff; font-weight: bold; }

        .btn {
            background: linear-gradient(90deg, #00d4ff 0%, #0099cc 100%);
            border: none;
            color: #000;
            padding: 12px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 10px;
            margin-right: 8px;
            font-size: 11px;
            transition: all 0.3s;
            width: 100%;
        }

        .btn:hover:not(:disabled) {
            background: linear-gradient(90deg, #00ffff 0%, #00ccff 100%);
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(0, 212, 255, 0.6);
        }

        .btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .btn-secondary {
            background: rgba(0, 212, 255, 0.15);
            border: 2px solid #00d4ff;
            color: #00d4ff;
        }

        .btn-secondary:hover:not(:disabled) {
            background: rgba(0, 212, 255, 0.25);
        }

        #statsPanel { top: 20px; left: 20px; width: 280px; }
        #roomPanel { top: 50%; left: 50%; transform: translate(-50%, -50%); width: 420px; display: none; z-index: 1000; }
        #receptionPanel { top: 50%; left: 50%; transform: translate(-50%, -50%); width: 420px; display: none; z-index: 1000; }

        .close-btn {
            position: absolute;
            top: 12px;
            right: 12px;
            background: rgba(233, 69, 96, 0.8);
            border: none;
            color: #fff;
            width: 36px;
            height: 36px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 20px;
            transition: all 0.2s;
        }

        .close-btn:hover { background: rgba(233, 69, 96, 1); }

        ::-webkit-scrollbar { width: 10px; }
        ::-webkit-scrollbar-track { background: rgba(0, 212, 255, 0.05); }
        ::-webkit-scrollbar-thumb { background: #00d4ff; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #00ffff; }

        .staff-row {
            background: rgba(0, 212, 255, 0.08);
            border-left: 3px solid #00d4ff;
            padding: 10px;
            margin: 8px 0;
            border-radius: 4px;
        }

        @keyframes popupFloat {
            0% { transform: translate(-50%, 0); opacity: 1; }
            100% { transform: translate(-50%, -60px); opacity: 0; }
        }
    </style>
</head>
<body>
    <div id="gameArea">
        <div id="topBar">
            <div class="stat-row">
                <div class="stat">
                    <span class="stat-icon">💰</span>
                    <span>$<span class="stat-value" id="moneyVal">5,100</span></span>
                </div>
                <div class="stat">
                    <span class="stat-icon">⚡</span>
                    <span id="mpsDisplay">+$10/s</span>
                </div>
                <div class="stat">
                    <span class="stat-icon">⭐</span>
                    <span>Rep: <span class="stat-value" id="repVal">0</span></span>
                </div>
                <div class="stat">
                    <span class="stat-icon">👥</span>
                    <span>Patients: <span class="stat-value" id="patientsVal">0</span></span>
                </div>
                <div class="stat">
                    <span class="stat-icon">👨‍⚕️</span>
                    <span>Staff: <span class="stat-value" id="staffVal">0</span></span>
                </div>
            </div>
            <div class="stat">
                <span class="stat-icon">🏥</span>
                <span style="font-weight: bold;">Community Clinic</span>
            </div>
        </div>

        <div id="canvasContainer">
            <canvas id="canvas"></canvas>
        </div>
    </div>

    <div class="panel" id="statsPanel">
        <div class="panel-title">📊 Hospital Status</div>
        <div class="stat-line">
            <span class="stat-label">Active Rooms:</span>
            <span class="stat-val" id="activeRooms">1</span>
        </div>
        <div class="stat-line">
            <span class="stat-label">Total Staff:</span>
            <span class="stat-val" id="totalStaffCount">0</span>
        </div>
        <div class="stat-line">
            <span class="stat-label">Income/Hour:</span>
            <span class="stat-val">$<span id="incomeHour">0</span></span>
        </div>
        <div class="stat-line">
            <span class="stat-label">Patients Waiting:</span>
            <span class="stat-val" id="waitingCount">0</span>
        </div>
        <div class="stat-line">
            <span class="stat-label">Patients Treated:</span>
            <span class="stat-val" id="treatedCount">0</span>
        </div>
    </div>

    <div class="panel" id="roomPanel">
        <button class="close-btn" onclick="closeRoom()">×</button>
        <div class="panel-title" id="roomTitle">Reception</div>
        <div id="roomContent"></div>
    </div>

    <div class="panel" id="receptionPanel">
        <button class="close-btn" onclick="closeReception()">×</button>
        <div class="panel-title">👨‍💼 Recruitment Center</div>
        <div id="receptionContent"></div>
    </div>

    <script>
        const ROOM_WIDTH = 150;
        const ROOM_HEIGHT = 120;
        const ROOM_DEPTH = 40;

        const game = {
            money: 5100,
            reputation: 0,
            prestige: 0,
            mps: 10,
            patientsServed: 0,
            patientQueue: [],
            staffList: [],
            floatingTexts: [],
            time: 0,
            nextPatientId: 0,
            nextStaffId: 0,

            rooms: [
                { id: 0, name: 'Reception', icon: '🪑', color: '#4CAF50', rgb: [76, 175, 80], owned: 1, level: 1, x: 0, y: 0, production: 0, staff: [], people: [] },
                { id: 1, name: 'Examination', icon: '🔬', color: '#2196F3', rgb: [33, 150, 243], owned: 0, level: 1, x: 1, y: 0, production: 50, staff: [], people: [] },
                { id: 2, name: 'Surgery', icon: '⚕️', color: '#FF6B6B', rgb: [255, 107, 107], owned: 0, level: 1, x: 2, y: 0, production: 150, staff: [], people: [] },
                { id: 3, name: 'ICU', icon: '🏨', color: '#FF9800', rgb: [255, 152, 0], owned: 0, level: 1, x: 0, y: 1, production: 200, staff: [], people: [] },
                { id: 4, name: 'Pharmacy', icon: '💉', color: '#9C27B0', rgb: [156, 39, 176], owned: 0, level: 1, x: 1, y: 1, production: 75, staff: [], people: [] },
                { id: 5, name: 'Lab', icon: '🧪', color: '#00BCD4', rgb: [0, 188, 212], owned: 0, level: 1, x: 2, y: 1, production: 100, staff: [], people: [] },
            ],

            staff: { intern: 0, resident: 0, attending: 0, specialist: 0 },
            staffCosts: { intern: 1000, resident: 3500, attending: 12000, specialist: 40000 },
            staffNames: { intern: 'Intern', resident: 'Resident', attending: 'Attending', specialist: 'Specialist' },
            staffColors: { intern: '#90caf9', resident: '#81c784', attending: '#ffb74d', specialist: '#f06292' },
            staffRGB: { intern: [144, 202, 249], resident: [129, 199, 132], attending: [255, 183, 77], specialist: [240, 98, 146] },
            staffEfficiency: { intern: 1, resident: 2.5, attending: 6, specialist: 12 },

            addFloatingText(x, y, text, color) {
                this.floatingTexts.push({ x, y, text, color, time: 0, duration: 2 });
            },

            update(dt) {
                this.time += dt;

                // Update floating texts
                for (let i = this.floatingTexts.length - 1; i >= 0; i--) {
                    this.floatingTexts[i].time += dt;
                    if (this.floatingTexts[i].time > this.floatingTexts[i].duration) {
                        this.floatingTexts.splice(i, 1);
                    }
                }

                // Patient arrival
                const maxPatients = Math.floor(20 + this.getTotalStaff() * 3);
                if (this.patientQueue.length < maxPatients && Math.random() < 0.5 * dt) {
                    const colors = ['#FF6B9D', '#C44569', '#FFA07A', '#87CEEB', '#98D8C8'];
                    this.patientQueue.push({
                        id: this.nextPatientId++,
                        color: colors[Math.floor(Math.random() * colors.length)],
                        state: 'waiting',
                        timeInState: 0,
                        x: 0,
                        y: 0,
                    });
                }

                // Update patients
                for (let i = this.patientQueue.length - 1; i >= 0; i--) {
                    const p = this.patientQueue[i];
                    p.timeInState += dt;

                    if (p.state === 'waiting') {
                        const treatableRooms = this.rooms.filter(r => r.owned > 0 && r.id > 0);
                        if (treatableRooms.length > 0 && p.timeInState > 1 + Math.random()) {
                            p.state = 'treating';
                            p.roomId = treatableRooms[Math.floor(Math.random() * treatableRooms.length)].id;
                            p.timeInState = 0;
                        }
                    } else if (p.state === 'treating') {
                        if (p.timeInState > 3 + Math.random() * 2) {
                            const reward = 50 + Math.random() * 100;
                            this.money += reward;
                            this.reputation += 2 + Math.random();
                            this.patientsServed += 1;
                            this.addFloatingText(0, 0, `+$${Math.floor(reward)}`, '#81c784');
                            this.patientQueue.splice(i, 1);
                        }
                    }
                }

                // Spawn staff characters
                let staffNeeded = this.getTotalStaff();
                while (this.staffList.length < staffNeeded) {
                    const tier = this.getStaffTierForIndex(this.staffList.length);
                    this.staffList.push({
                        id: this.nextStaffId++,
                        tier: tier,
                        targetRoom: this.rooms[Math.floor(Math.random() * this.rooms.length)],
                        moveTimer: Math.random() * 3,
                    });
                }

                // Remove extra staff
                while (this.staffList.length > staffNeeded) {
                    this.staffList.pop();
                }

                // Staff room assignment
                this.staffList.forEach(staff => {
                    staff.moveTimer -= dt;
                    if (staff.moveTimer <= 0) {
                        const availableRooms = this.rooms.filter(r => r.owned > 0);
                        staff.targetRoom = availableRooms[Math.floor(Math.random() * availableRooms.length)];
                        staff.moveTimer = 4 + Math.random() * 3;
                    }
                });

                // Calculate MPS
                this.mps = 5;
                Object.entries(this.staff).forEach(([tier, count]) => {
                    this.mps += count * this.staffEfficiency[tier] * 3;
                });
                this.mps += Math.min(this.patientQueue.length, 5) * 2;

                this.money += this.mps * dt;
            },

            getStaffTierForIndex(index) {
                let current = 0;
                for (const tier of ['intern', 'resident', 'attending', 'specialist']) {
                    if (index < current + this.staff[tier]) return tier;
                    current += this.staff[tier];
                }
                return 'intern';
            },

            buyRoom(id) {
                const cost = Math.floor(500 * Math.pow(1.5, this.rooms[id].owned));
                if (this.money >= cost) {
                    this.money -= cost;
                    this.rooms[id].owned += 1;
                    return true;
                }
                return false;
            },

            upgradeRoom(id) {
                const cost = Math.floor(1000 * Math.pow(1.4, this.rooms[id].level - 1));
                if (this.money >= cost) {
                    this.money -= cost;
                    this.rooms[id].level += 1;
                    return true;
                }
                return false;
            },

            hireStaff(tier) {
                if (this.money >= this.staffCosts[tier]) {
                    this.money -= this.staffCosts[tier];
                    this.staff[tier] += 1;
                    return true;
                }
                return false;
            },

            getTotalStaff() {
                return Object.values(this.staff).reduce((a, b) => a + b, 0);
            },

            format(n) {
                if (n >= 1e9) return (n / 1e9).toFixed(1) + 'B';
                if (n >= 1e6) return (n / 1e6).toFixed(1) + 'M';
                if (n >= 1e3) return (n / 1e3).toFixed(1) + 'K';
                return Math.floor(n).toString();
            }
        };

        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = canvas.offsetWidth;
            canvas.height = canvas.offsetHeight;
        }

        function drawIsometricBox(x, y, w, h, d, color, rgb) {
            // Top face
            ctx.fillStyle = color + '80';
            ctx.beginPath();
            ctx.moveTo(x, y);
            ctx.lineTo(x + w, y);
            ctx.lineTo(x + w + d/2, y + d/2);
            ctx.lineTo(x + d/2, y + d/2);
            ctx.closePath();
            ctx.fill();
            ctx.strokeStyle = color;
            ctx.lineWidth = 1.5;
            ctx.stroke();

            // Left face
            ctx.fillStyle = `rgb(${rgb[0]*0.6}, ${rgb[1]*0.6}, ${rgb[2]*0.6})`;
            ctx.beginPath();
            ctx.moveTo(x, y);
            ctx.lineTo(x + d/2, y + d/2);
            ctx.lineTo(x + d/2, y + h + d/2);
            ctx.lineTo(x, y + h);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            // Right face
            ctx.fillStyle = `rgb(${rgb[0]*0.8}, ${rgb[1]*0.8}, ${rgb[2]*0.8})`;
            ctx.beginPath();
            ctx.moveTo(x + w, y);
            ctx.lineTo(x + w + d/2, y + d/2);
            ctx.lineTo(x + w + d/2, y + h + d/2);
            ctx.lineTo(x + w, y + h);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
        }

        function drawPerson(x, y, color) {
            // Head
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.arc(x, y - 8, 4, 0, Math.PI * 2);
            ctx.fill();

            // Body
            ctx.fillRect(x - 2, y - 2, 4, 6);

            // Arms
            ctx.fillRect(x - 4, y, 8, 2);
        }

        function drawRoom(room) {
            const baseX = room.x * ROOM_WIDTH + room.y * ROOM_WIDTH / 2 + 400;
            const baseY = room.y * ROOM_HEIGHT / 2 + 150;

            if (room.owned === 0) {
                // Empty room - just outline
                ctx.fillStyle = 'rgba(255, 255, 255, 0.05)';
                ctx.strokeStyle = room.color + '40';
                ctx.lineWidth = 2;
                drawIsometricBox(baseX, baseY, ROOM_WIDTH, ROOM_HEIGHT, ROOM_DEPTH, room.color, room.rgb);

                ctx.fillStyle = room.color + '40';
                ctx.font = 'bold 14px Arial';
                ctx.textAlign = 'center';
                ctx.fillText(room.icon, baseX + ROOM_WIDTH/2 + ROOM_DEPTH/4, baseY + ROOM_HEIGHT/2 + ROOM_DEPTH/4);
                return;
            }

            // Draw room box
            drawIsometricBox(baseX, baseY, ROOM_WIDTH, ROOM_HEIGHT, ROOM_DEPTH, room.color, room.rgb);

            // Draw furniture based on room type
            const cx = baseX + ROOM_WIDTH/2 + ROOM_DEPTH/4;
            const cy = baseY + ROOM_HEIGHT/2 + ROOM_DEPTH/4;

            ctx.fillStyle = room.color;
            ctx.font = 'bold 36px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(room.icon, cx, cy - 10);

            // Room label
            ctx.font = 'bold 11px Arial';
            ctx.fillStyle = room.color;
            ctx.fillText(room.name, cx, cy + 25);

            // Owned/Level
            ctx.font = '9px Arial';
            ctx.fillStyle = '#aaa';
            ctx.fillText(`×${room.owned} | Lvl${room.level}`, cx, cy + 38);

            // Draw people in room
            const patientsInRoom = game.patientQueue.filter(p => p.roomId === room.id && p.state === 'treating');
            const staffInRoom = game.staffList.filter(s => s.targetRoom?.id === room.id);

            let personIdx = 0;
            patientsInRoom.slice(0, 2).forEach(() => {
                const px = baseX + 20 + personIdx * 30;
                const py = baseY + 60;
                drawPerson(px, py, patientsInRoom[personIdx]?.color || '#FF6B9D');
                personIdx++;
            });

            staffInRoom.slice(0, 2).forEach((staff, idx) => {
                const sx = baseX + 20 + idx * 30 + (patientsInRoom.length > 0 ? 30 : 0);
                const sy = baseY + 60;
                drawPerson(sx, sy, game.staffColors[staff.tier]);
            });

            room.clickArea = {
                x: baseX - 10,
                y: baseY - 20,
                w: ROOM_WIDTH + ROOM_DEPTH/2 + 20,
                h: ROOM_HEIGHT + ROOM_DEPTH + 20
            };
        }

        function drawGame() {
            // Background
            const bgGrad = ctx.createLinearGradient(0, 0, 0, canvas.height);
            bgGrad.addColorStop(0, '#0a0d14');
            bgGrad.addColorStop(1, '#0f1219');
            ctx.fillStyle = bgGrad;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Grid
            ctx.strokeStyle = 'rgba(0, 212, 255, 0.02)';
            ctx.lineWidth = 0.5;
            for (let i = 0; i < canvas.width; i += 50) {
                ctx.beginPath();
                ctx.moveTo(i, 0);
                ctx.lineTo(i, canvas.height);
                ctx.stroke();
            }
            for (let i = 0; i < canvas.height; i += 50) {
                ctx.beginPath();
                ctx.moveTo(0, i);
                ctx.lineTo(canvas.width, i);
                ctx.stroke();
            }

            // Draw rooms (back to front for proper layering)
            game.rooms.forEach(room => drawRoom(room));

            // Draw floating texts
            game.floatingTexts.forEach(ft => {
                const progress = ft.time / ft.duration;
                ctx.globalAlpha = Math.max(0, 1 - progress);
                ctx.fillStyle = ft.color;
                ctx.font = 'bold 18px Arial';
                ctx.textAlign = 'center';
                ctx.shadowColor = 'rgba(0,0,0,0.8)';
                ctx.shadowBlur = 8;
                ctx.fillText(ft.text, 100, 100 - progress * 50);
                ctx.shadowBlur = 0;
                ctx.globalAlpha = 1;
            });

            // Info overlay
            ctx.font = 'bold 14px Arial';
            ctx.fillStyle = '#00d4ff';
            ctx.textAlign = 'left';
            ctx.fillText(`👥 Patients Waiting: ${game.patientQueue.filter(p => p.state === 'waiting').length}`, 20, 30);

            ctx.font = '12px Arial';
            ctx.fillStyle = '#90b0d4';
            ctx.fillText(`👨‍⚕️ Staff: ${game.getTotalStaff()} | 💰 +$${game.format(game.mps)}/s`, 20, 48);
        }

        function updateUI() {
            document.getElementById('moneyVal').textContent = game.format(game.money);
            document.getElementById('mpsDisplay').textContent = `+$${game.format(game.mps)}/s`;
            document.getElementById('repVal').textContent = Math.floor(game.reputation);
            document.getElementById('patientsVal').textContent = Math.floor(game.patientsServed);
            document.getElementById('staffVal').textContent = game.getTotalStaff();

            const activeRooms = game.rooms.filter(r => r.owned > 0).length;
            document.getElementById('activeRooms').textContent = activeRooms;
            document.getElementById('totalStaffCount').textContent = game.getTotalStaff();
            document.getElementById('incomeHour').textContent = game.format(game.mps * 3600);
            document.getElementById('waitingCount').textContent = game.patientQueue.filter(p => p.state === 'waiting').length;
            document.getElementById('treatedCount').textContent = game.patientsServed;
        }

        function showRoom(id) {
            const room = game.rooms[id];
            const panel = document.getElementById('roomPanel');
            document.getElementById('roomTitle').textContent = `${room.icon} ${room.name}`;

            const buyCost = Math.floor(500 * Math.pow(1.5, room.owned));
            const upgradeCost = Math.floor(1000 * Math.pow(1.4, room.level - 1));

            let html = `
                <div class="stat-line"><span class="stat-label">Owned:</span><span class="stat-val">${room.owned}</span></div>
                <div class="stat-line"><span class="stat-label">Level:</span><span class="stat-val">${room.level}</span></div>
                <div class="stat-line"><span class="stat-label">Value:</span><span class="stat-val">$${game.format(room.production * room.level)}/patient</span></div>

                <button class="btn" onclick="game.buyRoom(${id}); updateUI(); showRoom(${id});" ${game.money < buyCost ? 'disabled' : ''}>
                    BUY ANOTHER - $${game.format(buyCost)}
                </button>
                <button class="btn" onclick="game.upgradeRoom(${id}); updateUI(); showRoom(${id});" ${game.money < upgradeCost ? 'disabled' : ''}>
                    UPGRADE LEVEL - $${game.format(upgradeCost)}
                </button>
            `;

            document.getElementById('roomContent').innerHTML = html;
            panel.style.display = 'block';
        }

        function closeRoom() {
            document.getElementById('roomPanel').style.display = 'none';
        }

        function showReception() {
            const panel = document.getElementById('receptionPanel');
            const content = document.getElementById('receptionContent');

            let html = '<div style="margin-bottom: 12px; font-size: 11px; color: #90b0d4;">Hire medical staff to treat more patients and increase hospital income.</div>';
            ['intern', 'resident', 'attending', 'specialist'].forEach(tier => {
                const cost = game.staffCosts[tier];
                const name = game.staffNames[tier];
                const count = game.staff[tier];
                const color = game.staffColors[tier];

                html += `
                    <div class="staff-row">
                        <div class="stat-line">
                            <span class="stat-label" style="color: ${color};">● ${name}</span>
                            <span class="stat-val">×${count}</span>
                        </div>
                        <button class="btn btn-secondary" onclick="game.hireStaff('${tier}'); updateUI(); showReception();" ${game.money < cost ? 'disabled' : ''}>
                            HIRE - $${game.format(cost)}
                        </button>
                    </div>
                `;
            });

            content.innerHTML = html;
            panel.style.display = 'block';
        }

        function closeReception() {
            document.getElementById('receptionPanel').style.display = 'none';
        }

        canvas.addEventListener('click', (e) => {
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            game.rooms.forEach((room, i) => {
                if (room.clickArea) {
                    const area = room.clickArea;
                    if (x > area.x && x < area.x + area.w && y > area.y && y < area.y + area.h) {
                        if (i === 0) showReception();
                        else showRoom(i);
                    }
                }
            });
        });

        let lastTime = Date.now();
        function gameLoop() {
            const now = Date.now();
            const dt = Math.min((now - lastTime) / 1000, 0.1);
            lastTime = now;

            game.update(dt);
            updateUI();
            drawGame();

            requestAnimationFrame(gameLoop);
        }

        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);
        gameLoop();
    </script>
</body>
</html>
